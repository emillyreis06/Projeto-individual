<script>
    function ganhar(){
        var mensagem = ""
        mensagem = `
<div class="massa_muscular">
  <h2>Processo de ganho de massa muscular</h2>

  <h3> Alimentação adequada</h3>
  <ul class="lista_massa"> 
    <li>Fazer dieta hipercalórica, consumindo mais calorias do que se gasta diariamente.</li>
    <li>Consumir frutas, pois contribuem no processo digestivo e facilitam a absorção de nutrientes.</li>
    <li>Alimentação rica em proteínas (como carne vermelha, frango, ovos), fundamentais para:
      <ul> 
        <li>Estimular a hipertrofia muscular (aumento do músculo);</li>
        <li>Ajudar na recuperação muscular após o treino, <br>
            já que os músculos sofrem micro lesões que precisam ser reparadas.</li>
      </ul>
    </li>
    <li>Incluir carboidratos complexos como arroz, batata e aveia para fornecer energia.</li>
    <li>Incluir gorduras boas: abacate, castanhas, nozes, azeite de oliva.</li>
  </ul>

  <h3> Treinamento eficaz</h3>
  <ul class="lista_massa">
    <li>Realizar treinos com intensidade, preferencialmente até a falha muscular.</li>
    <li>Manter o cárdio na rotina para evitar acúmulo de gordura e melhorar a saúde cardiovascular.</li>
  </ul>
</div>`

        div_mensagem.innerHTML = mensagem
    }

    function emagrecer(){
        var mensagem = "";
        mensagem = ` <div class = "emagrecer">
        <h2>Processo de Emagrecimento:</h2>

        <h3>Alimentação adequada</h3>
        <ul class= "lista_emagrecer">
            <li>Dieta restritiva 
                 <ul>
                    <li>Consumir menos calórias do que se gasta diariamente, <br>
                fazendo com que o organismo use as reservas de gordura como fonte de energia,
                contribuindo para o processo de emagrecimento </li>
                 </ul>
            </li>
            <li>Consumir alimentos ricos em fibras, como frutas, legumes e verduras<br>
                 <ul>
                    <li> Esses alimentos levam mais tempo para serem digeridos, controlando a fome no decorrer do dia</li>
                 </ul>
            </li>
            <li>Alimentaçao rica em proteínas magras (como ovo, frango ...)
                <ul>
                    <li> Promove maior saciedade, diminuindo a fome e facilitando a perda de peso</li>
                </ul>
            </li>
            
        </ul>

        <h3>Treinamento eficaz</h3>
        <ul class = "lista_emagrecer">
            <li>Combinar exercícios aeróbicos como caminhada,ciclismos e cárdios gerais 
                com de força como a própria músculação </li>
            <li>É importante que o corpo gaste uma grande quanridade de energia <br>
                para obter o resultado esperado.
            </li>
        </ul>
    </div>`
    div_mensagem.innerHTML = mensagem
    }

    function habitos(){
        var mensagem = "";
        mensagem = `
  <div class = "habitos_saudaveis">

        <ul class="lista_habitos">
            <li>Beber ao menos 2L de água por dia. </li>
            <li>Dormir bem, recomendado de 7-8 horas por dia</li>
            <li>Consumir alimentos saudavéis</li>
            <li>Ter períodos de descanso ( <i>"Sem descanso o músculo não cresce"</i>) </li>
            <li>Ter disciplina e constância para alcançar resultados desejados</li>
            <li>Manter uma alimentação balanceada</li>
            <li>Consultar um nutricionista e fazer exames regulares </li>
        </ul>
        
    </div>`

    div_mensagem.innerHTML = mensagem
    }
